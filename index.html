<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ポケモンカード図鑑</title>
<meta name="description" content="ポケモンカードをギャラリー形式で一覧・検索できる図鑑サイト。カード名・収録パック・イラストレーターで絞り込みできます。">
<meta name="theme-color" content="#0d0d13">
<meta property="og:type" content="website">
<meta property="og:title" content="ポケモンカード図鑑">
<meta property="og:description" content="ポケモンカードをギャラリー形式で一覧・検索できる図鑑サイト。">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="site-header">
    <div class="brand">
      <span class="brand-mark">P</span>
      <span class="brand-name">ポケモンカード図鑑</span>
    </div>

    <div class="toolbar">
      <input type="text" id="search-input" class="search-input" placeholder="カード名で検索">
      <select id="pack-filter" class="filter-select">
        <option value="">収録パック: すべて</option>
      </select>
      <select id="illustrator-filter" class="filter-select">
        <option value="">イラストレーター: すべて</option>
      </select>
    </div>
  </header>

  <main>
    <section class="card-grid" id="card-grid">
      <p class="loading-text">読み込み中...</p>
    </section>
  </main>

  <footer class="site-footer">
    <p>ダミーデータ表示中 - Phase3 動的機能</p>
  </footer>

  <div class="modal-backdrop" id="modal-backdrop" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-name">
      <button class="modal-close" id="modal-close" aria-label="閉じる">×</button>
      <div class="modal-art" id="modal-art"></div>
      <div class="modal-body">
        <h2 id="modal-name"></h2>
        <p class="modal-sub" id="modal-sub"></p>
        <dl class="modal-details" id="modal-details"></dl>
        <p class="modal-flavor" id="modal-flavor"></p>
      </div>
    </div>
  </div>

  <script src="js/main.js"></script>
</body>
</html>
